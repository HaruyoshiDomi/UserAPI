<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Cart</title>
</head>

<body>

<h1>カート一覧</h1>

<div id="cart-list"></div>

<h2 id="total-price">
    合計金額: 0円
</h2>
<script>

async function loadCart() {

    // JWT取得
    const token = localStorage.getItem("token");

    // API呼び出し
    const response = await fetch("/cart", {

        method: "GET",

        headers: {
            "Authorization": "Bearer " + token
        }
    });

    // JSON変換
    const carts = await response.json();

    console.log(carts);

    // div取得
    const cartList =
        document.getElementById("cart-list");

    // 画面初期化
    cartList.innerHTML = "";

    let totalPrice = 0;

    // 繰り返し
    carts.forEach(cart => {

        const subtotal =
        cart.price * cart.quantity;

        totalPrice += subtotal;

        cartList.innerHTML += `
            <hr>

            <h3>${cart.productName}</h3>

            <p>
                価格:
                ${cart.price.toLocaleString()}円
            </p>

            <p>
                数量:

                <button onclick="decreaseQuantity(${cart.cartId})">
                    -
                </button>

                ${cart.quantity}
                
                <button onclick="increaseQuantity(${cart.cartId})">
                    +
                </button>
            </p>

            <p>
                小計:
                ${subtotal.toLocaleString()}円
            </p>

            <button onclick="removeFromCart(${cart.cartId})">
                カートから削除
            </button>
                
        `;
        
    });
    document.getElementById("total-price")
    .innerText =
    "合計金額: " + totalPrice.toLocaleString() + "円";
}

async function removeFromCart(cartId) {

    // JWT取得
    const token =
        localStorage.getItem("token");

    // API呼び出し
    const response = await fetch(
        "/cart/" + cartId,
        {
            method: "DELETE",

            headers: {
                "Authorization":
                    "Bearer " + token
            }
        });

    // 成功時
    if (response.ok) {
        // 再読み込み
        loadCart();

    } else {

        alert("削除失敗");
    }
}

async function increaseQuantity(cartId) {

    const token =
        localStorage.getItem("token");

    const response = await fetch(
        "/cart/" + cartId + "/increase",
        {
            method: "PUT",

            headers: {
                "Authorization":
                    "Bearer " + token
            }
        });

    if (response.ok) {

        loadCart();
    }
}

async function decreaseQuantity(cartId) {

    const token =
        localStorage.getItem("token");

    const response = await fetch(
        "/cart/" + cartId + "/decrease",
        {
            method: "PUT",

            headers: {
                "Authorization":
                    "Bearer " + token
            }
        });

    if (response.ok) {

        loadCart();
    }
}

// 実行
loadCart();

</script>

</body>
</html>
